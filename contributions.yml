name: Update GitHub Contributions

on:
  schedule:
    # Every day at 03:00 UTC
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch GitHub contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            https://api.github.com/graphql \
            -d '{
              "query": "query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{totalContributions weeks{contributionDays{date contributionCount color weekday}}}}}}",
              "variables": {
                "login": "touhidcodes"
              }
            }' \
            -o contribution-data.json

      - name: Validate contribution data
        run: |
          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("contribution-data.json", "utf8")
          );

          if (data.errors) {
            console.error(JSON.stringify(data.errors, null, 2));
            process.exit(1);
          }

          if (!data.data?.user?.contributionsCollection?.contributionCalendar) {
            console.error("Contribution calendar data was not returned.");
            process.exit(1);
          }

          console.log(
            "Total contributions:",
            data.data.user.contributionsCollection.contributionCalendar
              .totalContributions
          );
          NODE

      - name: Generate contribution SVG
        run: |
          mkdir -p profile

          node <<'NODE'
          const fs = require("fs");

          const input = JSON.parse(
            fs.readFileSync("contribution-data.json", "utf8")
          );

          const calendar =
            input.data.user.contributionsCollection.contributionCalendar;

          const weeks = calendar.weeks;

          const cellSize = 12;
          const gap = 4;

          const leftPadding = 42;
          const rightPadding = 24;
          const topPadding = 42;
          const bottomPadding = 42;

          const weekWidth = cellSize + gap;
          const width =
            leftPadding +
            weeks.length * weekWidth +
            rightPadding;

          const height =
            topPadding +
            7 * weekWidth +
            bottomPadding;

          const colors = [
            "#161b22",
            "#0e4429",
            "#006d32",
            "#26a641",
            "#39d353"
          ];

          function levelFromCount(count) {
            if (count === 0) return 0;
            if (count <= 2) return 1;
            if (count <= 5) return 2;
            if (count <= 9) return 3;
            return 4;
          }

          function escapeXml(value) {
            return String(value)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&apos;");
          }

          const allDays = weeks.flatMap(
            (week) => week.contributionDays
          );

          const totalContributions = calendar.totalContributions;

          const latestDate =
            allDays.length > 0
              ? allDays[allDays.length - 1].date
              : "";

          const firstDate =
            allDays.length > 0
              ? allDays[0].date
              : "";

          let svg = `
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="${width}"
            height="${height}"
            viewBox="0 0 ${width} ${height}"
            role="img"
            aria-label="GitHub contribution calendar for touhidcodes"
          >

            <rect
              width="100%"
              height="100%"
              rx="12"
              fill="#0d1117"
            />

            <text
              x="${leftPadding}"
              y="26"
              fill="#f0f6fc"
              font-family="Arial, Helvetica, sans-serif"
              font-size="16"
              font-weight="600"
            >
              GitHub Contributions
            </text>

            <text
              x="${width - rightPadding}"
              y="26"
              text-anchor="end"
              fill="#8b949e"
              font-family="Arial, Helvetica, sans-serif"
              font-size="12"
            >
              ${escapeXml(totalContributions)} contributions
            </text>
          `;

          // Day labels
          const dayLabels = [
            { row: 1, label: "Mon" },
            { row: 3, label: "Wed" },
            { row: 5, label: "Fri" }
          ];

          for (const item of dayLabels) {
            const y =
              topPadding +
              item.row * weekWidth +
              cellSize -
              1;

            svg += `
              <text
                x="6"
                y="${y}"
                fill="#8b949e"
                font-family="Arial, Helvetica, sans-serif"
                font-size="10"
              >
                ${item.label}
              </text>
            `;
          }

          // Month labels
          let lastMonth = "";

          weeks.forEach((week, weekIndex) => {
            const firstDay = week.contributionDays[0];

            if (!firstDay) return;

            const date = new Date(
              `${firstDay.date}T00:00:00Z`
            );

            const month = date.toLocaleString("en-US", {
              month: "short",
              timeZone: "UTC"
            });

            const monthNumber = date.getUTCMonth();

            if (month !== lastMonth && monthNumber !== 0) {
              const x =
                leftPadding +
                weekIndex * weekWidth;

              svg += `
                <text
                  x="${x}"
                  y="${topPadding - 10}"
                  fill="#8b949e"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="10"
                >
                  ${month}
                </text>
              `;

              lastMonth = month;
            }
          });

          // Contribution squares
          weeks.forEach((week, weekIndex) => {
            week.contributionDays.forEach((day) => {
              const x =
                leftPadding +
                weekIndex * weekWidth;

              const y =
                topPadding +
                day.weekday * weekWidth;

              const level = levelFromCount(
                day.contributionCount
              );

              svg += `
                <rect
                  x="${x}"
                  y="${y}"
                  width="${cellSize}"
                  height="${cellSize}"
                  rx="2"
                  fill="${colors[level]}"
                >
                  <title>
                    ${escapeXml(day.contributionCount)}
                    contributions on
                    ${escapeXml(day.date)}
                  </title>
                </rect>
              `;
            });
          });

          // Legend
          const legendY = height - 22;

          svg += `
            <text
              x="${leftPadding}"
              y="${legendY}"
              fill="#8b949e"
              font-family="Arial, Helvetica, sans-serif"
              font-size="10"
            >
              Less
            </text>
          `;

          colors.forEach((color, index) => {
            const x =
              leftPadding +
              30 +
              index * (cellSize + 4);

            svg += `
              <rect
                x="${x}"
                y="${legendY - 9}"
                width="${cellSize}"
                height="${cellSize}"
                rx="2"
                fill="${color}"
              />
            `;
          });

          svg += `
            <text
              x="${leftPadding + 30 + colors.length * 16}"
              y="${legendY}"
              fill="#8b949e"
              font-family="Arial, Helvetica, sans-serif"
              font-size="10"
            >
              More
            </text>

            <text
              x="${width - rightPadding}"
              y="${legendY}"
              text-anchor="end"
              fill="#6e7681"
              font-family="Arial, Helvetica, sans-serif"
              font-size="9"
            >
              ${escapeXml(firstDate)} → ${escapeXml(latestDate)}
            </text>

          </svg>
          `;

          fs.writeFileSync(
            "profile/contributions.svg",
            svg.trim()
          );

          console.log(
            "Contribution SVG generated successfully."
          );
          NODE

      - name: Remove temporary data
        run: |
          rm -f contribution-data.json

      - name: Commit updated contribution graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/contributions.svg

          if git diff --cached --quiet; then
            echo "No contribution changes."
            exit 0
          fi

          git commit -m "chore: update contribution graph"
          git push
